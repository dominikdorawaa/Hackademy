name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_DEPLOY_ENABLED: 'true'
  HEROKU_APP: hackademy
  BACKEND_HEALTH_URL: https://api.hackademy.app/health
  PAGES_PROJECT: hackademy
  VITE_API_URL: https://api.hackademy.app
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
  WRANGLER_VERSION: 4.151.1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed parts
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            backend=true
            frontend=true
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER")
            if grep -qE '^(server/|Dockerfile$|\.dockerignore$|heroku\.yml$)' <<< "$files"; then backend=true; else backend=false; fi
            if grep -qE '^(client/|tools/ukos/)' <<< "$files"; then frontend=true; else frontend=false; fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Backend changed: $backend, frontend changed: $frontend"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml

  deploy-backend:
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check whether backend deployment is enabled
        if: env.BACKEND_DEPLOY_ENABLED != 'true'
        run: echo "::notice::Backend deployment to Heroku is disabled until the Heroku resources exist."
      - uses: actions/checkout@v7
        if: env.BACKEND_DEPLOY_ENABLED == 'true'
        with:
          fetch-depth: 0
      - name: Require the production sign-in configuration
        if: env.BACKEND_DEPLOY_ENABLED == 'true'
        run: |
          case "$VITE_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "::error::Set the production VITE_CLERK_PUBLISHABLE_KEY repository variable before deployment"; exit 1 ;;
          esac
      - name: Push to Heroku
        if: env.BACKEND_DEPLOY_ENABLED == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" "HEAD:refs/heads/main"
      - name: Wait for a healthy backend
        if: env.BACKEND_DEPLOY_ENABLED == 'true'
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "$BACKEND_HEALTH_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not become healthy at $BACKEND_HEALTH_URL"
          exit 1

  deploy-frontend:
    needs:
      - frontend-tests
      - deploy-backend
    if: always() && needs.frontend-tests.result == 'success' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prepare Linux workshop
        run: npm run ukos:prepare
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$COMMIT_SHA"

name: Frontend

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Frontend tests with Vitest, React Testing Library and MSW
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t = require('./coverage/coverage-summary.json').total; console.log('### Frontend coverage\n\n| Metric | Coverage |\n| --- | --- |\n' + ['lines', 'statements', 'functions', 'branches'].map(k => '| ' + k + ' | ' + t[k].pct + '% (' + t[k].covered + '/' + t[k].total + ') |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: client/coverage/
          if-no-files-found: ignore
          retention-days: 7

spring:
  application:
    name: server
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 1500
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/schema
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  tomcat:
    threads:
      max: 12
      min-spare: 2
    accept-count: 320
    max-connections: 512
    connection-timeout: 5s
    keep-alive-timeout: 20s
  port: ${PORT:8080}
  shutdown: graceful

application:
  realtime:
    presence-offline-grace: ${PRESENCE_OFFLINE_GRACE:5s}
  origin-guard:
    secrets: ${ORIGIN_GUARD_SECRETS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-keys: 50000
    rules:
      api-read:
        burst: 150
        limit: 300
        window: 1m
      api-write:
        burst: 50
        limit: 100
        window: 1m
      anonymous:
        burst: 150
        limit: 300
        window: 1m
      public-banner:
        burst: 1000
        limit: 1000
        window: 1m
      websocket-handshake:
        burst: 540
        limit: 540
        window: 1m
      websocket-transport:
        burst: 600
        limit: 3600
        window: 1m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
  clerk:
    issuer: ${CLERK_ISSUER}
    jwt-key: ${CLERK_JWT_KEY:}
    secret-key: ${CLERK_SECRET_KEY:}
    api-url: ${CLERK_API_URL:https://api.clerk.com/v1}
    import-users: ${CLERK_IMPORT_USERS:false}

vpn:
  server:
    host: ${VPN_SERVER_HOST:}
    user: ${VPN_SERVER_USER:}
    private-key-path: ${VPN_SERVER_PRIVATE_KEY_PATH:}

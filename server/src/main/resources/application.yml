spring:
  application:
    name: server
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/schema
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: ${PORT:8080}
  shutdown: graceful

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
  clerk:
    issuer: ${CLERK_ISSUER}
    jwt-key: ${CLERK_JWT_KEY:}
    secret-key: ${CLERK_SECRET_KEY:}
    api-url: ${CLERK_API_URL:https://api.clerk.com/v1}
    import-users: ${CLERK_IMPORT_USERS:false}

vpn:
  server:
    host: ${VPN_SERVER_HOST:}
    user: ${VPN_SERVER_USER:}
    private-key-path: ${VPN_SERVER_PRIVATE_KEY_PATH:}

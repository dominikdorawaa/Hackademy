spring:
  application:
    name: server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/schema
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

application:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION_MS:86400000}

vpn:
  server:
    host: ${VPN_SERVER_HOST:}
    user: ${VPN_SERVER_USER:}
    private-key-path: ${VPN_SERVER_PRIVATE_KEY_PATH:}

services:
  # Backend (Java/Spring) – na Renderze Java działa tylko przez Docker
  - type: web
    name: hackademy-twth
    runtime: docker
    plan: free
    repo: https://github.com/dominikdorawaa/Hackademy.git
    autoDeploy: true
    dockerfilePath: Dockerfile
    healthCheckPath: /api/rooms
    buildFilter:
      paths:
        - server/**
        - pom.xml
        - Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hackademy-frontend.onrender.com

  # Frontend (Static Site)
  - type: web
    name: hackademy-frontend
    runtime: static
    plan: free
    repo: https://github.com/dominikdorawaa/Hackademy.git
    autoDeploy: true
    buildFilter:
      paths:
        - client/**
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # WAŻNE: W panelu Render (Environment) dla hackademy-frontend dodaj:
    # VITE_API_URL = https://hackademy-twth.onrender.com

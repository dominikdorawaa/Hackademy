services:
  # Backend (Java/Spring) – na Renderze Java działa tylko przez Docker
  - type: web
    name: hackademy-twth
    runtime: docker
    plan: free
    repo: https://github.com/dominikdorawaa/Hackademy.git
    autoDeploy: true
    dockerfilePath: Dockerfile
    healthCheckPath: /api/rooms
    buildFilter:
      paths:
        - server/**
        - pom.xml
        - Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hackademy-front.onrender.com

  # Frontend (Static Site)
  - type: web
    name: hackademy-front
    runtime: static
    plan: free
    repo: https://github.com/dominikdorawaa/Hackademy.git
    autoDeploy: true
    rootDir: client
    buildFilter:
      paths:
        - client/**
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://hackademy-twth.onrender.com

services:
  - type: web
    name: hackademy-server
    env: java
    repo: https://github.com/your-repo/hackademy # TODO: Zmień na swoje repozytorium
    plan: free
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
        - pom.xml
    buildCommand: "cd server && mvn clean package -DskipTests"
    startCommand: "java -jar target/server-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /api/rooms 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackademy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hackademy-client.onrender.com

  - type: staticsite
    name: hackademy-client
    repo: https://github.com/your-repo/hackademy # TODO: Zmień na swoje repozytorium
    plan: free
    autoDeploy: true
    buildFilter:
      paths:
        - client/**
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "dist"
    # WAŻNE: Ustaw zmienną środowiskową VITE_API_URL w panelu Render
    # na adres URL Twojego backendu (np. https://hackademy-server.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hackademy-db
    databaseName: hackademy
    user: hackademy_user
    plan: free
